```svg
<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F4EB"/>
      <stop offset="1" stop-color="#EEE7D7"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#131916"/>
      <stop offset="1" stop-color="#0B0F0D"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      }
      .pixel {
        font-family: "Courier New", monospace;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>

  <!-- subtle background dots -->
  <g opacity="0.12">
    <circle cx="120" cy="120" r="3" fill="#7B705E"/>
    <circle cx="180" cy="180" r="2" fill="#7B705E"/>
    <circle cx="1020" cy="130" r="3" fill="#7B705E"/>
    <circle cx="1080" cy="200" r="2" fill="#7B705E"/>
    <circle cx="110" cy="620" r="3" fill="#7B705E"/>
    <circle cx="1030" cy="610" r="3" fill="#7B705E"/>
  </g>

  <!-- computer body -->
  <g filter="url(#shadow)">
    <rect x="275" y="90" width="650" height="470" rx="26" fill="#D8CCB3"/>
    <rect x="295" y="110" width="610" height="390" rx="18" fill="#C9BCA3"/>
    <rect x="325" y="140" width="550" height="300" rx="12" fill="#4E5A54"/>
    <rect x="337" y="152" width="526" height="276" rx="8" fill="url(#screenGlow)"/>

    <!-- floppy slot -->
    <rect x="720" y="465" width="110" height="10" rx="5" fill="#9C8F77"/>

    <!-- drive details -->
    <circle cx="360" cy="470" r="16" fill="#B6A98E"/>
    <circle cx="360" cy="470" r="5" fill="#8F826B"/>

    <!-- logo square (generic, not Apple) -->
    <rect x="825" y="455" width="28" height="28" rx="6" fill="#B8AB91"/>
    <rect x="831" y="461" width="16" height="16" rx="3" fill="#8C7F68"/>
  </g>

  <!-- screen text -->
  <g class="mono" fill="#8AF7A3" filter="url(#innerGlow)">
    <text x="370" y="205" font-size="28">&gt; booting tommi.os...</text>
    <text x="370" y="250" font-size="28">&gt; loading projects...</text>
    <text x="370" y="295" font-size="28">&gt; moro, oon Tommi</text>
    <text x="370" y="340" font-size="28">&gt; web builder / dev / entrepreneur</text>
    <text x="370" y="385" font-size="28">&gt; welcome</text>

    <!-- blinking cursor -->
    <rect x="525" y="398" width="16" height="26" fill="#8AF7A3">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanlines -->
  <g opacity="0.08">
    <rect x="337" y="168" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="188" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="208" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="228" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="248" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="268" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="288" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="308" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="328" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="348" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="368" width="526" height="2" fill="#C8FFD2"/>
    <rect x="337" y="388" width="526" height="2" fill="#C8FFD2"/>
  </g>

  <!-- stand -->
  <g filter="url(#shadow)">
    <rect x="520" y="560" width="160" height="38" rx="12" fill="#C5B89E"/>
    <rect x="455" y="598" width="290" height="26" rx="12" fill="#B6A88E"/>
  </g>

  <!-- caption -->
  <text x="600" y="680" text-anchor="middle" class="pixel" font-size="22" fill="#7E725D">
    built with coffee, curiosity and probably unnecessary overengineering
  </text>
</svg>
